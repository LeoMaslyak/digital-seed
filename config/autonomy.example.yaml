# Digital Seed Autonomy Configuration
# Controls what your AI can do automatically.
#
# Permission levels:
#   off    — always ask before doing anything
#   notify — do it automatically, then tell you what happened
#   auto   — do it silently, appears only in the daily digest
#
# Start conservative (everything off), then enable what you trust.
# Change notify → auto once you've seen it work a few times.
#
# VISIBILITY GUARANTEE: the level you set here is the FLOOR for how visible an
# action is. The system must never silently downgrade `notify` to `auto` (e.g.
# while you are "sleeping") — a notify action you don't see in real time should
# be QUEUED and surfaced when you return, never dropped. If you want an action
# to run without a notification, set it to `auto` yourself.
#
# Autonomy is never widened automatically. Precedent learning may SUGGEST raising
# a level after repeated REAL human approvals, but the change only takes effect
# when you explicitly accept it. Approvals are counted only from your own
# confirmations — the system cannot approve its own actions into a higher tier.

# ── Email ────────────────────────────────────────────────────────────────────
# Classify and prioritise your inbox (does NOT send emails)
email-triage: off

# ── Memory ───────────────────────────────────────────────────────────────────
# Compress old sessions, keep MEMORY.md accurate and compact
memory-maintenance: notify

# ── Notes ────────────────────────────────────────────────────────────────────
# Suggest tags, links, structure for new notes (suggestions only, no edits)
note-organization: off

# ── Daily Digest ─────────────────────────────────────────────────────────────
# End-of-day summary of what happened automatically
daily-digest: notify

# ── Reminders ────────────────────────────────────────────────────────────────
# Surface tasks due today or overdue
task-reminders: notify

# ── Research ─────────────────────────────────────────────────────────────────
# Proactively track topics you care about for new information
research-updates: off
