# Digital Seed Embedding Pipeline Configuration
# Controls what gets indexed for semantic search (RAG)
# Supports three layers: personal (L3), collab (L2), knowledge index (L1)

# Embedding provider: "openai" or "ollama"
#
# DEFAULT: local (ollama / nomic-embed-text). With the local provider, your
# content is embedded ON YOUR MACHINE and nothing leaves it.
#
# Cloud embeddings (OpenAI) send the FULL TEXT of every indexed file to
# OpenAI's API. They are OFF by default — even when OPENAI_API_KEY is set —
# and require an explicit opt-in: set the environment variable RAG_EMBED_CLOUD=1.
# Setting "provider: openai" below WITHOUT RAG_EMBED_CLOUD=1 will be ignored and
# fall back to local. Only enable cloud if you are comfortable sending these
# files to OpenAI (it counts against your own OpenAI account/billing).
#
# To use cloud embeddings, set RAG_EMBED_CLOUD=1 AND optionally:
# provider: openai
# model: text-embedding-3-small
# dimensions: 1536

# ─── L3: Personal index ───────────────────────────────────────────
# Your private notes, goals, preferences.
# With the default local provider these stay on your machine. If you opt into
# cloud embeddings (RAG_EMBED_CLOUD=1), the contents of these paths ARE sent to
# OpenAI — do not enable cloud unless you accept that.
paths:
  - user/
  - patterns/
  - docs/

# ─── L1: Knowledge Index ───────────────────────────────────────────
# Shared shared knowledge index. Populated by:
#   (a) git clone of digital-seed-knowledge-base (cloned to ~/.digital-seed-knowledge-base by setup.sh)
#   (b) shared drive sync: bun run shared-drive:sync --layer knowledge-base
# Uncomment after running setup:
# knowledgeBasePaths:
#   - ~/.digital-seed-knowledge-base/
#   - data/shared-drive-cache/knowledge-base/

# ─── L2: Collab index ────────────────────────────────────────────
# Active team workspaces. Populated by:
#   bun run shared-drive:sync --layer collab
# Uncomment when using team workspaces:
# collabPaths:
#   - collab/
#   - data/shared-drive-cache/collab/

# File types to include
fileTypes:
  - .md
  - .txt
  - .yaml
  - .yml

# Paths/patterns to exclude
exclude:
  - node_modules
  - .git
  - data/rag
  - bun.lock
  - "*.jsonl"
  - vectors.json
  - "*.lock"
  - _sync-meta.json

# Chunking settings
chunkSize: 1000
chunkOverlap: 200
