name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Pinned Bun. Bump deliberately when a new release is validated locally.
        bun: ["1.3.8"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Set up Python (for visual QA)
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python image library
        run: python3 -m pip install --upgrade Pillow

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release check (CI mode)
        # Composes health, privacy scan, visual QA, onboard, first-prompt,
        # link check, and version consistency. --ci skips the fresh-clone
        # harness (avoids recursive expensive CI) and never invokes Drive.
        run: bun run seed release-check --ci --skip-install
