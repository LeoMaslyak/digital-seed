  # ── A real local tool the kit itself uses ───────────────────────────────────
  - id: ollama
    name: Ollama
    category: utility
    serves: ["run AI models locally", "free local embeddings", "offline AI, no account", "powers local semantic search"]
    phase: 2
    repo: https://github.com/ollama/ollama
    install: { method: see-repo, note: "official installer at ollama.com" }
    trust: { tier: vetted, provenance: official, reviewed: "the standard local model runner; Digital Seed uses it for local embeddings" }
    accesses: [filesystem, network]
    when_to_use: "The easiest way to run models on your own machine — free, no account. Powers `seed index` local semantic search when installed (`ollama pull nomic-embed-text`)."
    caution: "Pulls model files over the network (large downloads); inference then runs locally. Models themselves vary in quality/license — pick reputable ones."
    alternatives: [ref-awesome-local-ai]
